<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" font-family="sans-serif">
  <!-- Styles -->
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: white; stroke: #cbd5e1; stroke-width: 2; rx: 8; }
      .title { font-size: 16px; font-weight: bold; fill: #1e293b; }
      .text { font-size: 13px; fill: #475569; }
      .line { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 4,4; fill: none; }
      .solid-line { stroke: #64748b; stroke-width: 2; fill: none; }
      .arrow { fill: #64748b; }
    </style>
    <!-- Arrowhead -->
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 5, 0 10" class="arrow" />
    </marker>
    <marker id="arrowhead-dash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <polygon points="0 0, 10 5, 0 10" fill="#94a3b8" />
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- Presentation Tier -->
  <rect x="50" y="30" width="500" height="90" class="box" />
  <text x="65" y="55" class="title">Presentation Tier (/presentation)</text>
  <text x="65" y="75" class="text">Browser SPA (HTML/CSS/JS) • Express routes • Controllers</text>
  <text x="65" y="95" class="text">Responsibility: input/output, HTTP↔JSON, rendering</text>

  <!-- Arrow Presentation -> Business -->
  <line x1="300" y1="120" x2="300" y2="160" class="solid-line" marker-end="url(#arrowhead)" />
  <text x="310" y="145" class="text">Plain objects &amp; domain errors</text>

  <!-- Business Tier -->
  <rect x="50" y="170" width="500" height="100" class="box" />
  <text x="65" y="195" class="title">Business Tier (/business)</text>
  <text x="65" y="215" class="text">BookService • bookValidator • domain errors</text>
  <text x="65" y="235" class="text">Responsibility: validation, business rules, orchestration</text>
  <text x="65" y="255" class="text">Depends on: BookRepository (interface)</text>

  <!-- Interface seam -->
  <line x1="300" y1="270" x2="300" y2="310" class="line" marker-end="url(#arrowhead-dash)" />
  <text x="310" y="295" class="text">implements BookRepository</text>

  <!-- Data Tier - Postgres -->
  <rect x="50" y="320" width="230" height="90" class="box" />
  <text x="65" y="345" class="title">PostgresBookRepository</text>
  <text x="65" y="365" class="text">(/data/repositories)</text>
  <text x="65" y="385" class="text">pg Pool → Neon Postgres</text>

  <!-- Data Tier - InMemory -->
  <rect x="320" y="320" width="230" height="90" class="box" />
  <text x="335" y="345" class="title">InMemoryBookRepository</text>
  <text x="335" y="365" class="text">(/data/repositories)</text>
  <text x="335" y="385" class="text">Map, no I/O</text>

  <!-- Data Tier Base Label -->
  <text x="260" y="440" class="title">Data Tier (/data)</text>
  <text x="145" y="460" class="text">Responsibility: read/write only. No validation.</text>

</svg>
